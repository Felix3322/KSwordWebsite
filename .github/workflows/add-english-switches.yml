name: Add English switches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-english-switches.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add per-page language links
        shell: python
        run: |
          from pathlib import Path

          root = Path('ksword-website')
          pages = {
              root / 'changelog.html': ('en/changelog.html', 'changelog.html'),
              root / 'docs/index.html': ('../en/docs/index.html', '../docs/index.html'),
              root / 'docs/contact.html': ('../en/docs/contact.html', '../docs/contact.html'),
              root / 'docs/credits.html': ('../en/docs/credits.html', '../docs/credits.html'),
              root / 'docs/license.html': ('../en/docs/license.html', '../docs/license.html'),
          }
          github_link = '<a href="https://github.com/KSwordDEV/KSword" rel="noreferrer" target="_blank">GitHub ↗</a>'

          for path, (english_path, chinese_path) in pages.items():
              text = path.read_text(encoding='utf-8')
              english_link = f'<a href="{english_path}" hreflang="en">English</a>'
              if english_link not in text:
                  text = text.replace(github_link, english_link + '\n' + github_link, 1)
              alternate = f'<link href="{english_path}" hreflang="en" rel="alternate"/>'
              if alternate not in text:
                  stylesheet = '../styles.css' if '/docs/' in '/' + path.as_posix() else 'styles.css'
                  marker = f'<link href="{stylesheet}" rel="stylesheet"/>'
                  text = text.replace(marker, marker + '\n' + alternate, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          rm .github/workflows/add-english-switches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksword-website/changelog.html ksword-website/docs/index.html ksword-website/docs/contact.html ksword-website/docs/credits.html ksword-website/docs/license.html .github/workflows/add-english-switches.yml
          git commit -m "Add English switches to all pages"
          git push
