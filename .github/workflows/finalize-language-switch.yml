name: Finalize language switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-language-switch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add English link to Chinese homepage
        shell: python
        run: |
          from pathlib import Path
          path = Path('ksword-website/index.html')
          html = path.read_text(encoding='utf-8')
          if 'href="en/index.html"' not in html:
              html = html.replace(
                  '<a href="https://github.com/KSwordDEV/KSword" rel="noreferrer" target="_blank">GitHub ↗</a>',
                  '<a href="en/index.html" hreflang="en">English</a>\n<a href="https://github.com/KSwordDEV/KSword" rel="noreferrer" target="_blank">GitHub ↗</a>',
                  1
              )
          if 'hreflang="en" rel="alternate"' not in html:
              html = html.replace(
                  '<link href="styles.css" rel="stylesheet"/>',
                  '<link href="styles.css" rel="stylesheet"/>\n<link href="en/index.html" hreflang="en" rel="alternate"/>',
                  1
              )
          path.write_text(html, encoding='utf-8')

      - name: Commit final language switch
        run: |
          rm -f .github/workflows/finalize-language-switch.yml
          rm -f .github/workflows/add-english-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksword-website/index.html .github/workflows/finalize-language-switch.yml .github/workflows/add-english-homepage.yml
          git commit -m "Add English language switch"
          git push
